[package]
name = "rust_lib_chronos_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "chronos_proxy"
path = "src/bin/chronos_proxy.rs"

[[bin]]
name = "chronos_vault"
path = "src/bin/chronos_vault.rs"

[dependencies]
flutter_rust_bridge = "=2.13.0"
rusqlite = { version = "0.33", features = ["bundled"] }
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.33"
tokio = { version = "1.36", features = ["net", "io-util", "rt-multi-thread", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1.12"
openssl = "0.10"
flate2 = "1.1"
# Ed25519 verification + SHA-256 for signed self-updates (already pulled in by rustls).
ring = "0.17"
httparse = "1.8"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
